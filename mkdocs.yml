site_name: 散修讀經典
site_url: https://edtao168.github.io/jingdian/

theme:
  name: material
  language: zh-Hant
  palette:
    primary: indigo
  features:
    - navigation.tabs          # 頂部顯示「經部 | 史部 | 子部 | 集部」
    # - navigation.sections    # ⚠️ 務必刪除或註解這一行！否則左側不會縮排！
    - navigation.indexes       # 允許點擊「論語」直接打開 index.md

nav:
  - 總序: index.md
  - 經部:
      - 論語:
          - 論語: 01_jing/lun_yu/index.md
          - 學而: 01_jing/lun_yu/01_xue_er.md
          - 為政: 01_jing/lun_yu/02_wei_zheng.md
      - 詩經:
          - 簡介: 01_jing/shi_jing/index.md
  - 史部:
      - 史記: 02_shi/shi_ji/index.md
  - 子部:
      - 老子: 03_zi/lao_zi/index.md
  - 集部:
      - 楚辭:
          - 解題與總目: 04_ji/chu_ci/index.md
          - 離騷: 04_ji/chu_ci/01_li_sao.md
          - 九歌·山鬼: 04_ji/chu_ci/02_jiu_ge/shan_gui.md